name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck-and-build:
    name: Typecheck & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-package-lock

      - name: Typecheck
        run: npm run lint

      - name: Run unit tests
        run: npm test

      - name: Build web app and Chrome extension
        run: npm run build:all

      - name: Package Chrome Web Store zip
        run: npm run package:extension

      - name: Validate Chrome Web Store manifest & icons
        run: |
          node -e "
            const fs = require('fs');
            for (const f of ['manifest.json', 'sidepanel.html', 'background.js', 'content.js', 'icons/icon16.png', 'icons/icon32.png', 'icons/icon48.png', 'icons/icon128.png']) {
              if (!fs.existsSync('dist-extension/' + f)) throw new Error('Missing dist-extension/' + f);
            }
            const manifest = JSON.parse(fs.readFileSync('dist-extension/manifest.json', 'utf8'));
            if (!manifest.description || manifest.description.length > 132) {
              throw new Error('manifest.description must be <= 132 chars');
            }
            console.log('dist-extension CWS bundle validated successfully');
          "

      - name: Upload Chrome Extension zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: pebble-chrome-extension
          path: release/*.zip
