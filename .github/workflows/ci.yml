name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck-and-build:
    name: Typecheck & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-package-lock

      - name: Typecheck
        run: npm run lint

      - name: Build web app and Chrome extension
        run: npm run build:all

      - name: Validate built Chrome Extension bundle
        run: |
          node -e "
            const fs = require('fs');
            for (const f of ['manifest.json', 'sidepanel.html', 'background.js', 'content.js']) {
              if (!fs.existsSync('dist-extension/' + f)) throw new Error('Missing dist-extension/' + f);
            }
            JSON.parse(fs.readFileSync('dist-extension/manifest.json', 'utf8'));
            console.log('dist-extension bundle validated successfully');
          "
